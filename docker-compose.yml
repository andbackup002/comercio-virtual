version: '3.8'

services:
  # Bancos de Dados Ativos
  postgres:
    image: postgres:latest
    container_name: auth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis-api-gateway:
    image: redis:6.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_api_gateway_data:/data
    networks:
      - backend

  # Serviços Principais Ativos
  api-gateway:
    build: 
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_URL=redis://redis-api-gateway:6379
      - JWT_SECRET=123456
    depends_on:
      - redis-api-gateway
      - auth-service
    networks:
      - backend

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=auth_service
      - JWT_SECRET=your_jwt_secret_key
    depends_on:
      - postgres
    networks:
      - backend

